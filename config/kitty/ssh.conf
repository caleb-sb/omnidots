# Config for kitty's ssh kitten:  kitten ssh <host>
#
# The kitten needs nothing installed on the remote (POSIX shell + tar only). It
# ships xterm-kitty terminfo into the remote $HOME, which fixes "open terminal
# failed" on hosts that have never seen kitty, and copies the files below.

hostname *
  copy .config/tmux/tokyonight_storm.conf
  copy --dest .tmux.conf .config/tmux/tmux-remote.conf
