# hyprlock: the screen locker. Syntax: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

# The password and a fingerprint work in parallel: hyprlock asks fprintd for a
# finger over D-Bus while PAM checks the password. Without a reader, or
# without fprintd, hyprlock turns fingerprint off and takes the password.
auth {
    # password-auth never includes pam_fprintd. hyprlock's default PAM service
    # includes login, which picks it up from system-auth once authselect's
    # with-fingerprint is on, and would then wait for a finger before taking
    # the password.
    pam {
        module = password-auth
    }

    fingerprint {
        enabled = true
    }
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    fade_on_empty = false
    # Only one is set at a time.
    fail_text = $PAMFAIL$FPRINTFAIL
}
