# hyprlock: the screen locker. Syntax: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

# The password and a fingerprint work in parallel: hyprlock asks fprintd for a
# finger over D-Bus while PAM checks the password. Without a reader, or
# without fprintd, hyprlock turns fingerprint off and takes the password.
auth {
    # password-auth never includes pam_fprintd. hyprlock's default PAM service
    # includes login, which picks it up from system-auth once authselect's
    # with-fingerprint is on, and would then wait for a finger before taking
    # the password.
    pam {
        module = password-auth
    }

    # $FPRINTPROMPT, shown under the password field. It stays empty without
    # a reader, so the hint only appears on machines that have one.
    fingerprint {
        enabled = true
        ready_message = Scan your finger or type your password
        present_message = Scanning…
    }
}

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

# Tokyo Night (night) colours, from folke/tokyonight.nvim's palette.
$bg = rgb(1a1b26)
$bgDark = rgb(16161e)
$fg = rgb(c0caf5)
$fgDark = rgb(a9b1d6)
$comment = rgb(565f89)
$blue = rgb(7aa2f7)
$green = rgb(9ece6a)
$yellow = rgb(e0af68)
$red = rgb(f7768e)
$font = JetBrainsMono Nerd Font
# Greeting, Spotify track and battery (scripts/lockinfo.sh).
$info = ~/.config/hypr/scripts/lockinfo.sh

background {
    monitor =
    path = screenshot
    blur_passes = 3
    # Darker than the default, so the text stands out on any screen.
    brightness = 0.6
    # Shown if the screenshot can't be taken.
    color = $bg
}

# ── Time, date and greeting ───────────────────────────────────────
label {
    monitor =
    text = <b>$TIME</b>
    color = $fg
    font_family = $font
    font_size = 96
    position = 0, 240
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    color = $fgDark
    font_family = $font
    font_size = 20
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] $info greeting
    color = $blue
    font_family = $font
    font_size = 16
    position = 0, 60
    halign = center
    valign = center
}

# ── Password ──────────────────────────────────────────────────────
input-field {
    monitor =
    size = 320, 50
    position = 0, -20
    halign = center
    valign = center
    rounding = 6
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    fade_on_empty = false
    outer_color = $blue
    inner_color = $bgDark
    font_color = $fg
    font_family = $font
    placeholder_text = <span foreground="##565f89">Password</span>
    check_color = $green
    fail_color = $red
    capslock_color = $yellow
    # Only one is set at a time.
    fail_text = $PAMFAIL$FPRINTFAIL
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = $comment
    font_family = $font
    font_size = 12
    position = 0, -75
    halign = center
    valign = center
}

# ── Spotify and battery, along the bottom ─────────────────────────
label {
    monitor =
    text = cmd[update:2000] $info media
    color = $fgDark
    font_family = $font
    font_size = 13
    position = 0, 40
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:10000] $info battery
    color = $fgDark
    font_family = $font
    font_size = 13
    position = -40, 40
    halign = right
    valign = bottom
}
