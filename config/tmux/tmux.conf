# vim:ft=tmux
# tmux config. Theme is Tokyo Night Storm, matching kitty and Neovim.
#
# Key conflict rules for this machine:
#   - Hyprland binds only SUPER+* and media keys, which tmux never sees.
#   - kitty consumes ctrl+shift+*, so nothing here may use it.

#### Terminal ####

set -g default-shell /usr/bin/fish
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"

#### Behaviour ####

set -g escape-time 10          # otherwise <Esc> lags in Neovim
set -g focus-events on         # Neovim autoread/autosave
set -g mouse on
set -g history-limit 50000
set -g set-clipboard on
set -g detach-on-destroy off   # closing a session drops into another, not out
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

#### Copy mode ####

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'wl-copy'

#### Keybindings ####

bind r source-file "~/.config/tmux/tmux.conf" \; display "config reloaded"

# Splits inherit the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Give C-b and C-l back to whatever is running in the pane
bind C-b send-prefix
bind C-l send-keys C-l

# Zoom the current pane to fill the window (default binding was prefix z,
# which stays bound too). Overrides the default prefix f (find-window);
# prefix w gives the same reachability.
bind f resize-pane -Z

# Resize, repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane navigation is C-h/j/k/l, handled by vim-tmux-navigator below.

#### Sessions ####

# Fuzzy session switcher. Overrides the default next-layout binding.
bind Space display-popup -E "\
  tmux list-sessions -F '#{session_name}' |\
  grep -v \"^$(tmux display-message -p '#S')\$\" |\
  fzf --reverse --header='switch session' |\
  xargs -r tmux switch-client -t"

bind M-Space next-layout
bind S command-prompt -p "new session:" "new-session -s '%%'"

#### Theme ####

source-file "~/.config/tmux/tokyonight_storm.conf"

#### Plugins ####

# Kept outside the dotfiles repo so clones stay untracked.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

run "~/.local/share/tmux/plugins/tpm/tpm"
