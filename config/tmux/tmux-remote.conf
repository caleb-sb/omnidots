# vim:ft=tmux
# Remote tmux config, shipped to hosts by kitty's ssh kitten (../kitty/ssh.conf),
# which drops it at ~/.tmux.conf on the remote.
#
# Deliberately plugin-free: tpm, fzf, fish and wl-clipboard are not assumed to
# exist there. Keep the keybindings in sync with tmux.conf by hand.

#### Terminal ####

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"

#### Behaviour ####

set -g escape-time 10          # otherwise <Esc> lags in Neovim
set -g focus-events on         # Neovim autoread/autosave
set -g mouse on
set -g history-limit 50000
set -g set-clipboard on        # OSC 52, so yanks reach the local kitty clipboard
set -g detach-on-destroy off
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# tmux-sensible equivalents, since the plugin is not available here
set -g display-time 4000
set -g status-interval 5
set -g history-file ~/.tmux_history

#### Copy mode ####

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

#### Keybindings ####

bind r source-file "~/.tmux.conf" \; display "config reloaded"

# Splits inherit the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Give C-b and C-l back to whatever is running in the pane
bind C-b send-prefix
bind C-l send-keys C-l

# Zoom the current pane to fill the window (default binding was prefix z,
# which stays bound too). Overrides the default prefix f (find-window);
# prefix w gives the same reachability.
bind f resize-pane -Z

# Resize, repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane navigation. Locally this is vim-tmux-navigator; here it is plain binds,
# so the chords stay the same whichever end you are on.
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

#### Sessions ####

bind S command-prompt -p "new session:" "new-session -s '%%'"

#### Theme ####

source-file "~/.config/tmux/tokyonight_storm.conf"
